<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16221e"><title>GymMonitor｜訓練監測</title><link rel="stylesheet" href="style.css?v=7"><script defer src="catalog.js"></script><script defer src="research.js"></script><script defer src="observations.js"></script><script defer src="camera.js"></script><script defer src="session.js?v=7"></script><script defer src="demo.js?v=7"></script><script defer src="capture.js?v=7"></script><script defer src="app.js?v=7"></script></head>
<body><header><a class="brand" href="#workout">GymMonitor</a><nav aria-label="其他功能"><button id="open-library" class="plain">動作庫</button><button id="open-history" class="plain">紀錄</button></nav></header>
<main id="workout"><section class="intro"><h1>訓練監測</h1><p>開始後，由鏡頭辨識動作、計次和組間休息。</p></section>
<div class="workout"><section class="panel monitor" aria-label="訓練畫面">
<div class="viewport" id="viewport"><video id="video" playsinline muted aria-label="姿態辨識畫面"></video><canvas id="overlay" aria-hidden="true"></canvas><div id="preview" class="preview"><span id="preview-title">準備開始</span><small>讓關節入鏡，畫面保持單人。</small></div><div class="lens-controls" id="lens-controls"><span id="lens-state" role="status"></span><button id="switch-lens" class="plain" type="button">切換鏡頭</button></div></div>
<div class="status"><div><p id="state" role="status">待開始</p><h2 id="move">自動辨識</h2><p id="cue" class="subtle"></p></div><div id="metric" class="metric" aria-label="即時數字">—</div></div>
<div class="controls"><div id="move-input"><label for="choose-move">選擇動作（選填）</label><button id="choose-move" class="plain" type="button">自動辨識</button></div><div class="main-controls"><button id="start" class="primary">開始訓練</button><button id="pause" class="plain" hidden>暫停</button><button id="stop" class="primary stop" hidden>結束訓練</button></div>
<details id="options"><summary>訓練選項</summary><div class="option-grid"><button id="pick" class="plain">選影片分析</button><input id="file" type="file" accept="video/*" hidden></div><p class="subtle" id="auto-scope"></p></details>
</div></section>
<aside><section class="panel set-panel" aria-label="上一組"><div><p class="subtle">上一組</p><h2 id="last-move">尚未開始</h2><p id="last-detail"></p></div><button id="edit-last" class="plain" hidden>改動作</button><div id="quick-set" hidden><div id="quick-reps"><button id="rep-minus" class="plain" aria-label="減一下">−</button><output id="quick-count"></output><button id="rep-plus" class="plain" aria-label="加一下">＋</button></div><label>重量（kg）<input id="quick-weight" type="number" inputmode="decimal" min="0" step="any" placeholder="未填"></label><button id="same-weight" class="plain" hidden></button></div></section>
<section class="panel muscles" id="muscles" hidden><div id="demo-photos" hidden><figure><img id="demo-start" loading="lazy" alt="動作起始姿勢"><figcaption>起始</figcaption></figure><figure><img id="demo-end" loading="lazy" alt="動作完成位置"><figcaption>動作位置</figcaption></figure><a id="demo-credit" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener noreferrer">素材：Free Exercise DB</a></div><div><h2>起始姿勢與肌群</h2><p id="setup"></p><p id="primary-muscle"></p><p id="secondary-muscle"></p><small>取景綠色標示為目標區域示意。</small></div></section></aside></div>
<p id="notice" class="subtle" role="status">影像在裝置端分析，紀錄儲存在此瀏覽器。</p></main>
<datalist id="move-options"></datalist>
<dialog id="editor"><form id="edit-form"><h2>修正訓練組</h2><label>動作<input id="edit-name" list="move-options" required maxlength="80"></label><label id="rep-field">次數<input id="edit-reps" type="number" min="1" max="999" step="1" placeholder="未計次"></label><label id="manual-duration" hidden>時長（分鐘）<input id="edit-minutes" type="number" min="0.01" step="any"></label><details id="extra-edit"><summary>重量與備註</summary><label>重量（kg）<input id="edit-weight" type="number" min="0" step="any"></label><label>備註<input id="edit-note" maxlength="300"></label></details><p id="edit-duration" class="subtle"></p><div class="dialog-actions"><button type="button" data-close="editor" class="plain">取消</button><button class="primary">儲存</button></div><p id="edit-error" role="status"></p></form></dialog>
<dialog id="history"><div class="dialog-top"><h2>訓練紀錄</h2><button class="plain" data-close="history">關閉</button></div><div id="records"></div><details><summary>其他紀錄功能</summary><button id="manual" class="plain">手動新增</button><div class="dialog-actions"><button id="export" class="plain">匯出</button><label class="file-label">匯入<input id="import" type="file" accept=".json,application/json"></label></div><p id="importmsg" role="status"></p></details></dialog>
<dialog id="library"><div class="dialog-top"><h2>動作庫</h2><button class="plain" data-close="library">關閉</button></div><label>搜尋<input id="search" type="search" placeholder="例如 面拉或腿推"></label><div id="library-list"></div><article id="guide" hidden><h3 id="guide-name"></h3><p id="guide-cue"></p><p id="guide-camera"></p><a id="guide-source" target="_blank" rel="noopener noreferrer">查看來源</a></article></dialog>
<dialog id="move-picker" aria-labelledby="picker-title"><div class="dialog-top"><h2 id="picker-title">選擇動作</h2><button type="button" class="plain" data-close="move-picker">關閉</button></div><label for="picker-search">搜尋動作</label><input id="picker-search" type="search" placeholder="例如：深蹲、側平舉"><div class="picker-nav"><button type="button" class="plain" id="pick-auto">使用自動辨識</button><button type="button" class="plain" id="picker-back" hidden>返回類別</button></div><p id="picker-scope" class="subtle" role="status"></p><div id="picker-list"></div></dialog><dialog id="weight-editor" aria-labelledby="weight-title"><form id="weight-form"><h2 id="weight-title">修改本組重量</h2><p id="weight-context"></p><label>重量（kg）<input id="weight-value" type="number" inputmode="decimal" min="0" step="any" placeholder="未填"></label><div class="dialog-actions"><button type="button" class="plain" data-close="weight-editor">取消</button><button class="primary" type="submit">儲存重量</button></div><p id="weight-error" role="status"></p></form></dialog></body></html>
